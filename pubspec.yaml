name: radiobb_app
description: "Oficjalna aplikacja mobilna Radia BB – Beskidzkie brzmienia. Rozgłośnia Beskidzkiej Grupy Medialnej."
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  just_audio: ^0.9.36
  audio_service: ^0.18.12
  http: ^1.2.1
  xml: ^6.5.0
  url_launcher: ^6.3.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  intl: ^0.19.0
  share_plus: ^9.0.0
  flutter_local_notifications: ^17.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
